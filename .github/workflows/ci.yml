name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }} / Pi ${{ matrix.pi }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        pi: ["locked", "1.0.4"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies (Pi 1.0.2)
        run: npm ci
      - name: Install compatibility-test host
        if: matrix.pi != 'locked'
        env:
          PI_VERSION: ${{ matrix.pi }}
        run: npm install --no-save --package-lock=false "@earendil-works/pi-coding-agent@$PI_VERSION"
      - name: Typecheck and test
        run: npm run check
      - name: Inspect package contents
        run: npm pack --dry-run
