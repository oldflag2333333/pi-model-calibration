name: Publish to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example v0.1.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml
    with:
      ref: refs/tags/${{ inputs.tag || github.ref_name }}

  publish:
    needs: check
    if: github.repository == 'oldflag2333333/model-calibration'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Validate release version
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, appendFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          assert.equal(process.env.RELEASE_TAG, `v${version}`, 'Git tag must match package.json version');
          assert.equal(lock.version, version, 'Lockfile version must match package.json');
          assert.equal(lock.packages[''].version, version, 'Lockfile root version must match package.json');
          const distTag = version.includes('-') ? 'next' : 'latest';
          appendFileSync(process.env.GITHUB_OUTPUT, `dist-tag=${distTag}\n`);
          NODE
      - name: Ensure npm supports trusted publishing
        # OIDC requires npm >=11.5.1; do not rely on the runner's bundled npm.
        run: npm install --global npm@11
      - name: Install locked dependencies
        run: npm ci
      - name: Final check
        run: npm run check
      - name: Inspect package contents
        run: npm pack --dry-run
      - name: Publish with OIDC
        env:
          DIST_TAG: ${{ steps.release.outputs.dist-tag }}
        run: npm publish --access public --tag "$DIST_TAG"
